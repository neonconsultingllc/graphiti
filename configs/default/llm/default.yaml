# Configuration using prompt library paths
# This is a sample configuration that demonstrates using the exact prompt library paths as configuration keys

# Common parameters for all prompts
common:
  temperature: 0.7
  top_p: 0.95
  frequency_penalty: 0.0
  presence_penalty: 0.0
  max_tokens: 8192

# Model selection settings
model_selection:
  default_client: "OllamaClient"
  default_instance: "local"
  default_model: "llama3.3:70b-instruct-q8_0"
  
  # Model selection for specific prompt types
  extract_nodes:
    client: "OllamaClient"
    instance: "local"
    model: "llama3.3:70b-instruct-q8_0"
  
  extract_edges:
    client: "OllamaClient"
    instance: "local"
    model: "llama3.3:70b-instruct-q8_0"



# Top-level prompt categories
extract_nodes:
  temperature: 0.2
  max_tokens: 4096
  
  # Sub-categories
  extract_message:
    max_tokens: 6144
  
  extract_text:
    max_tokens: 4096
    
  extract_json:
    max_tokens: 4096
    
  reflexion:
    temperature: 0.0
    max_tokens: 2048
    
  classify_nodes:
    temperature: 0.1
    max_tokens: 2048

extract_edges:
  temperature: 0.1
  max_tokens: 8192
  
  edge:
    max_tokens: 8192
    
  reflexion:
    temperature: 0.0
    max_tokens: 2048

dedupe_nodes:
  temperature: 0.1
  max_tokens: 4096
  
  node:
    max_tokens: 4096
    
  node_list:
    max_tokens: 4096

dedupe_edges:
  temperature: 0.1
  max_tokens: 4096
  
  edge:
    max_tokens: 4096
    
  edge_list:
    max_tokens: 4096

invalidate_edges:
  temperature: 0.1
  max_tokens: 4096
  
  v2:
    max_tokens: 4096

extract_edge_dates:
  temperature: 0.1
  max_tokens: 2048
  
  v1:
    max_tokens: 2048

summarize_nodes:
  temperature: 0.3
  max_tokens: 1024
  
  summarize_pair:
    max_tokens: 1024
    
  summarize_context:
    max_tokens: 1024
    
  summary_description:
    max_tokens: 512

eval:
  temperature: 0.0
  max_tokens: 2048
  
  qa_prompt:
    max_tokens: 2048
    
  eval_prompt:
    max_tokens: 2048
    
  query_expansion:
    max_tokens: 1024
